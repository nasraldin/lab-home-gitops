# Official OpenClaw Kustomize base (adapted for lab).
# Upstream: https://docs.openclaw.ai/install/kubernetes
# Namespace ai-tools is owned by platform/namespaces (do not recreate here).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: ai-tools
resources:
  - secret.yaml
  - pvc.yaml
  - configmap.yaml
  - deployment.yaml
  - service.yaml
