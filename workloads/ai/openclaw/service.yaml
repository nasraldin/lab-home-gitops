apiVersion: v1
kind: Service
metadata:
  name: openclaw
  labels:
    app: openclaw
  annotations:
    lbipam.cilium.io/ips: "192.168.68.113"
spec:
  type: LoadBalancer
  ipFamilyPolicy: SingleStack
  ipFamilies:
    - IPv4
  selector:
    app: openclaw
  ports:
    - name: gateway
      port: 18789
      targetPort: 18789
      protocol: TCP
