apiVersion: v1
kind: Namespace
metadata:
  name: ai
  labels:
    app.kubernetes.io/part-of: lab-ai
---
apiVersion: v1
kind: Secret
metadata:
  name: openclaw-secrets
  namespace: ai
type: Opaque
stringData:
  OPENCLAW_GATEWAY_TOKEN: "cd38ba92dd5cc3499582b6a532c575e13246281cb313f059"
  LITELLM_API_KEY: "sk-lab-litellm-59e851e6f6202963a67be3e262a7a647"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: openclaw-config
  namespace: ai
data:
  openclaw.json: |
    {
      "models": {
        "providers": {
          "litellm": {
            "baseUrl": "http://litellm.litellm.svc.cluster.local:4000/v1",
            "apiKey": "sk-lab-litellm-59e851e6f6202963a67be3e262a7a647",
            "api": "openai-completions",
            "request": { "allowPrivateNetwork": true },
            "models": [
              {
                "id": "gemma4:12b",
                "name": "Gemma4 12B (fast)",
                "reasoning": false,
                "input": ["text"],
                "contextWindow": 4096,
                "maxTokens": 2048
              },
              {
                "id": "gemma4:12b-think",
                "name": "Gemma4 12B Think",
                "reasoning": true,
                "input": ["text"],
                "contextWindow": 4096,
                "maxTokens": 2048
              },
              {
                "id": "qwen3.5:9b",
                "name": "Qwen3.5 9B",
                "reasoning": false,
                "input": ["text"],
                "contextWindow": 4096,
                "maxTokens": 2048
              }
            ]
          }
        }
      },
      "agents": {
        "defaults": {
          "model": { "primary": "litellm/gemma4:12b" }
        }
      },
      "gateway": {
        "mode": "local",
        "bind": "lan",
        "controlUi": {
          "allowedOrigins": [
            "http://openclaw.lab",
            "http://192.168.68.113:18789"
          ]
        }
      }
    }
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: openclaw-data
  namespace: ai
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: longhorn-1r
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: openclaw
  namespace: ai
  labels:
    app.kubernetes.io/name: openclaw
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: openclaw
  template:
    metadata:
      labels:
        app.kubernetes.io/name: openclaw
    spec:
      nodeSelector:
        workload: apps
      securityContext:
        fsGroup: 1000
      containers:
        - name: openclaw
          image: ghcr.io/openclaw/openclaw:2026.7.1
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - |
              set -e
              mkdir -p /home/node/.openclaw/workspace
              cp /config/openclaw.json /home/node/.openclaw/openclaw.json
              exec node dist/index.js gateway --bind lan --port 18789
          ports:
            - name: gateway
              containerPort: 18789
            - name: bridge
              containerPort: 18790
          env:
            - name: HOME
              value: /home/node
            - name: OPENCLAW_HOME
              value: /home/node
            - name: OPENCLAW_STATE_DIR
              value: /home/node/.openclaw
            - name: OPENCLAW_CONFIG_PATH
              value: /home/node/.openclaw/openclaw.json
            - name: OPENCLAW_CONFIG_DIR
              value: /home/node/.openclaw
            - name: OPENCLAW_WORKSPACE_DIR
              value: /home/node/.openclaw/workspace
            - name: OPENCLAW_GATEWAY_TOKEN
              valueFrom:
                secretKeyRef:
                  name: openclaw-secrets
                  key: OPENCLAW_GATEWAY_TOKEN
            - name: TZ
              value: UTC
          volumeMounts:
            - name: data
              mountPath: /home/node/.openclaw
            - name: config
              mountPath: /config
              readOnly: true
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              memory: 2Gi
          readinessProbe:
            httpGet:
              path: /healthz
              port: gateway
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: gateway
            initialDelaySeconds: 40
            periodSeconds: 30
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: openclaw-data
        - name: config
          configMap:
            name: openclaw-config
            items:
              - key: openclaw.json
                path: openclaw.json
---
apiVersion: v1
kind: Service
metadata:
  name: openclaw
  namespace: ai
  annotations:
    lbipam.cilium.io/ips: "192.168.68.113"
spec:
  type: LoadBalancer
  selector:
    app.kubernetes.io/name: openclaw
  ports:
    - name: gateway
      port: 18789
      targetPort: gateway
