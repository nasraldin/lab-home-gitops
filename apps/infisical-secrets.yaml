---
apiVersion: secrets.infisical.com/v1alpha1
kind: InfisicalSecret
metadata:
  name: litellm-secrets
  namespace: ai-tools
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  hostAPI: http://192.168.68.25:8090/api
  resyncInterval: 60
  authentication:
    universalAuth:
      secretsScope:
        projectSlug: apps
        envSlug: prod
        secretsPath: /litellm
        recursive: false
      credentialsRef:
        secretName: infisical-universal-auth
        secretNamespace: security
  # litellm-secrets is ONLY for postgresql.auth.existingSecret (POSTGRES_*).
  # Do not also mount it as LiteLLM environmentSecrets — POSTGRES_* env pollution
  # breaks Prisma DB auth. Proxy master key lives in chart Secret litellm-masterkey.
  managedKubeSecretReferences:
    - secretName: litellm-secrets
      secretNamespace: ai-tools
      creationPolicy: Owner
      template:
        includeAllSecrets: true
        data:
          PROXY_MASTER_KEY: "{{ .LITELLM_MASTER_KEY.Value }}"
          POSTGRES_PASSWORD: "{{ .LITELLM_POSTGRES_PASSWORD.Value }}"
          POSTGRES_USER_PASSWORD: "{{ .LITELLM_POSTGRES_USER_PASSWORD.Value }}"
