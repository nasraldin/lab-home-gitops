apiVersion: secrets.infisical.com/v1alpha1
kind: InfisicalSecret
metadata:
  name: librechat-env
  namespace: ai-tools
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  hostAPI: http://192.168.68.25:8090/api
  # Installed operator CRD uses top-level resyncInterval (not syncConfig).
  resyncInterval: 60
  authentication:
    universalAuth:
      secretsScope:
        projectSlug: apps
        envSlug: prod
        secretsPath: /librechat
        recursive: false
      credentialsRef:
        secretName: infisical-universal-auth
        secretNamespace: security
  managedKubeSecretReferences:
    - secretName: librechat-env
      secretNamespace: ai-tools
      creationPolicy: Owner
      template:
        includeAllSecrets: true
        data:
          # Infisical templates expose TemplateSecret structs — must use .Value
          # (bare {{ .KEY }} stringifies as "{value /path}" and breaks auth).
          CREDS_KEY: "{{ .LIBRECHAT_CREDS_KEY.Value }}"
          CREDS_IV: "{{ .LIBRECHAT_CREDS_IV.Value }}"
          JWT_SECRET: "{{ .LIBRECHAT_JWT_SECRET.Value }}"
          JWT_REFRESH_SECRET: "{{ .LIBRECHAT_JWT_REFRESH_SECRET.Value }}"
          MEILI_MASTER_KEY: "{{ .LIBRECHAT_MEILI_MASTER_KEY.Value }}"
          # Shared LiteLLM gateway key (seeded as LIBRECHAT_LITELLM_API_KEY).
          LITELLM_API_KEY: "{{ .LIBRECHAT_LITELLM_API_KEY.Value }}"
          # LIBRECHAT_ADMIN_* come from includeAllSecrets — do not re-template
          # without .Value (bare {{ .KEY }} corrupts email/password for seed Job).
---
