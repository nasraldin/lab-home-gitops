apiVersion: secrets.infisical.com/v1alpha1
kind: InfisicalSecret
metadata:
  name: librechat-env
  namespace: ai-tools
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  hostAPI: http://192.168.68.25:8090/api
  syncConfig:
    resyncInterval: 60s
  authentication:
    universalAuth:
      secretsScope:
        projectSlug: apps
        envSlug: prod
        secretsPath: /librechat
        recursive: false
      credentialsRef:
        secretName: infisical-universal-auth
        secretNamespace: security
  managedKubeSecretReferences:
    - secretName: librechat-env
      secretNamespace: ai-tools
      creationPolicy: Owner
      template:
        includeAllSecrets: true
        data:
          CREDS_KEY: "{{ .LIBRECHAT_CREDS_KEY }}"
          CREDS_IV: "{{ .LIBRECHAT_CREDS_IV }}"
          JWT_SECRET: "{{ .LIBRECHAT_JWT_SECRET }}"
          JWT_REFRESH_SECRET: "{{ .LIBRECHAT_JWT_REFRESH_SECRET }}"
          MEILI_MASTER_KEY: "{{ .LIBRECHAT_MEILI_MASTER_KEY }}"
          # Shared LiteLLM gateway key (also seeded under kubernetes/observability).
          LITELLM_API_KEY: "{{ .LIBRECHAT_LITELLM_API_KEY | default .LITELLM_MASTER_KEY }}"
---
