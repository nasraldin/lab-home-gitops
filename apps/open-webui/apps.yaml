# Open WebUI → LiteLLM gateway (not Ollama directly)
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: apps-open-webui
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "63"
spec:
  project: default
  source:
    repoURL: ghcr.io/open-webui/helm-charts
    chart: open-webui
    targetRevision: 15.2.0
    helm:
      releaseName: open-webui
      values: |
        # Inference is on ai-01 via LiteLLM — do not install in-cluster Ollama.
        ollama:
          enabled: false
        pipelines:
          enabled: false
        tika:
          enabled: false
        enableOpenaiApi: true
        openaiBaseApiUrl: "http://litellm.litellm.svc.cluster.local:4000/v1"
        openaiApiKey: "sk-lab-litellm-59e851e6f6202963a67be3e262a7a647"
        # Single replica: in-memory websockets (skip bundled Redis).
        websocket:
          enabled: true
          manager: ""
          redis:
            enabled: false
        persistence:
          enabled: true
          size: 10Gi
          storageClass: longhorn
        service:
          type: LoadBalancer
          port: 80
          annotations:
            lbipam.cilium.io/ips: "192.168.68.109"
        ingress:
          enabled: false
        nodeSelector:
          workload: apps
        resources:
          requests:
            cpu: 100m
            memory: 512Mi
          limits:
            memory: 2Gi
        extraEnvVars:
          - name: DEFAULT_MODELS
            value: "gemma4:12b"
  destination:
    server: https://kubernetes.default.svc
    namespace: open-webui
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
