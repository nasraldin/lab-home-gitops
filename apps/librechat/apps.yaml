# LibreChat → LiteLLM gateway → Ollama on ai-01 (gemma4:12b)
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: apps-librechat
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "60"
spec:
  project: default
  source:
    repoURL: ghcr.io/danny-avila/librechat-chart
    chart: librechat
    targetRevision: 2.0.7
    helm:
      releaseName: librechat
      values: |
        # Secrets from Infisical → Secret librechat-env (see apps/infisical-secrets.yaml).
        global:
          librechat:
            existingSecretName: librechat-env
        librechat:
          existingSecretName: librechat-env
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              memory: 2Gi
          configEnv:
            # Public signup off; admin is seeded by apps/librechat/seed-admin-job.yaml
            # (npm run create-user) using LIBRECHAT_ADMIN_* from librechat-env / Infisical.
            ALLOW_EMAIL_LOGIN: "true"
            ALLOW_REGISTRATION: "false"
            ALLOW_UNVERIFIED_EMAIL_LOGIN: "true"
            ALLOW_SOCIAL_LOGIN: "false"
            ALLOW_SOCIAL_REGISTRATION: "false"
            DOMAIN_CLIENT: "http://chat.lab"
            DOMAIN_SERVER: "http://chat.lab"
          configYamlContent: |
            version: 1.2.1
            cache: true
            endpoints:
              custom:
                - name: "LiteLLM"
                  # Resolves from librechat-env (LITELLM_API_KEY); never commit the key.
                  apiKey: "${LITELLM_API_KEY}"
                  baseURL: "http://litellm.ai-tools.svc.cluster.local:4000/v1"
                  models:
                    default:
                      - "gemma4:12b"
                      - "gemma4:12b-think"
                      - "qwen3.5:9b"
                    # false = only the list above (fetch duplicated gemma4-12b alias)
                    fetch: false
                  titleConvo: true
                  titleModel: "current_model"
                  modelDisplayLabel: "Lab"
          imageVolume:
            enabled: true
            size: 10G
            storageClassName: longhorn
        mongodb:
          enabled: true
          image:
            repository: bitnamilegacy/mongodb
          auth:
            enabled: false
          # RWO PVC cannot attach to two nodes during RollingUpdate
          architecture: standalone
          updateStrategy:
            type: Recreate
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
          persistence:
            storageClass: longhorn
            size: 8Gi
        meilisearch:
          enabled: true
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
          persistence:
            enabled: true
            storageClass: longhorn
          auth:
            existingMasterKeySecret: librechat-env
          environment:
            MEILI_ENV: production
            MEILI_NO_ANALYTICS: true
        librechat-rag-api:
          enabled: false
        redis:
          enabled: false
        service:
          type: LoadBalancer
          port: 3080
          annotations:
            lbipam.cilium.io/ips: "192.168.68.105"
        ingress:
          enabled: false
        nodeSelector:
          workload: apps
  destination:
    server: https://kubernetes.default.svc
    namespace: ai-tools
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
