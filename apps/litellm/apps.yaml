# LiteLLM — OpenAI-compatible gateway → Ollama on llm-01
# Clients (LibreChat, AnythingLLM, n8n, Open WebUI) should call this service,
# not Ollama directly.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: apps-litellm
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "55"
spec:
  project: default
  source:
    repoURL: ghcr.io/berriai
    chart: litellm-helm
    targetRevision: 1.93.0
    helm:
      releaseName: litellm
      values: |
        replicaCount: 1
        image:
          repository: ghcr.io/berriai/litellm-database
          pullPolicy: IfNotPresent
        # Master key: chart-managed Secret litellm-masterkey (key masterkey → PROXY_MASTER_KEY).
        # Do NOT put litellm-secrets in environmentSecrets — that secret also holds
        # POSTGRES_* keys for the Bitnami subchart; envFrom pollution breaks Prisma auth.
        # Postgres passwords stay in litellm-secrets via postgresql.auth.existingSecret.
        masterkey: ""
        environmentSecrets: []
        service:
          type: LoadBalancer
          port: 4000
          annotations:
            lbipam.cilium.io/ips: "192.168.68.108"
        ingress:
          enabled: false
        nodeSelector:
          workload: apps
        resources:
          requests:
            cpu: 100m
            memory: 768Mi
          limits:
            memory: 2Gi
        redis:
          enabled: false
        db:
          deployStandalone: true
          useExisting: false
        postgresql:
          # Bitnami moved versioned tags to docker.io/bitnamilegacy (Aug 2025).
          global:
            security:
              allowInsecureImages: true
          image:
            registry: docker.io
            repository: bitnamilegacy/postgresql
            tag: 16.2.0-debian-12-r6
          architecture: standalone
          auth:
            username: litellm
            database: litellm
            # Passwords from Infisical Secret litellm-secrets (POSTGRES_*).
            existingSecret: litellm-secrets
            secretKeys:
              userPasswordKey: POSTGRES_USER_PASSWORD
              adminPasswordKey: POSTGRES_PASSWORD
          primary:
            resources:
              requests:
                cpu: 50m
                memory: 256Mi
            persistence:
              storageClass: longhorn
              size: 8Gi
            nodeSelector:
              workload: apps
        proxy_config:
          model_list:
            # Distinct IDs for LibreChat dropdown (no duplicate aliases).
            - model_name: gemma4:12b
              litellm_params:
                model: openai/gemma4:12b
                api_base: http://192.168.68.26:11434/v1
                api_key: ollama
                extra_body:
                  reasoning_effort: none
                num_ctx: 4096
            - model_name: gemma4:12b-think
              litellm_params:
                model: openai/gemma4:12b
                api_base: http://192.168.68.26:11434/v1
                api_key: ollama
                extra_body:
                  reasoning_effort: high
                num_ctx: 4096
            - model_name: qwen3.5:9b
              litellm_params:
                model: openai/qwen3.5:9b
                api_base: http://192.168.68.26:11434/v1
                api_key: ollama
                extra_body:
                  reasoning_effort: none
                num_ctx: 4096
          litellm_settings:
            drop_params: true
          general_settings:
            master_key: os.environ/PROXY_MASTER_KEY
        migrationJob:
          hooks:
            argocd:
              enabled: true
  destination:
    server: https://kubernetes.default.svc
    namespace: ai-tools
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
