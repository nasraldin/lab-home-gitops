# Longhorn Helm values (mirrored into clusters/single/platform-apps.yaml).
# Worker data disks: Terraform `data_disk_gb` (700 GiB) mounted at /var/lib/longhorn
# by ansible role k8s_longhorn_disk before this chart syncs.
defaultSettings:
  defaultReplicaCount: 2
  storageOverProvisioningPercentage: 100
  # Keep most of each data disk schedulable (was 30% by chart default — caused false
  # "out of capacity" with 100–700 GiB disks that were mostly empty).
  storageReservedPercentageForDefaultDisk: "5"
persistence:
  defaultClassReplicaCount: 2
preUpgradeChecker:
  jobEnabled: false
service:
  ui:
    type: LoadBalancer
    loadBalancerIP: 192.168.68.104
