# Bootstrap notes for Infisical operator credentials.
# The Secret itself is NEVER committed — create it once on the cluster.
apiVersion: v1
kind: Namespace
metadata:
  name: security
  labels:
    app.kubernetes.io/part-of: lab-home
    lab.nasraldin.com/role: security
---
# Placeholder ConfigMap documenting required Secret keys (not credentials).
apiVersion: v1
kind: ConfigMap
metadata:
  name: infisical-auth-bootstrap-hint
  namespace: security
data:
  README: |
    Create Secret infisical-universal-auth in this namespace (security) with keys:
      clientId
      clientSecret
    From Infisical → Organization → Machine Identities → Universal Auth.

    Grant the identity read access to Infisical projects:
      kubernetes, apps  (and pipelines if CI needs cluster pull)

    Seed values from lab-home-k8s:
      ansible-playbook playbooks/infisical-seed.yml -e @secrets.yml

    Per-app InfisicalSecret CRs live under:
      platform/keycloak/infisical-secret.yaml
      platform/harbor/infisical-secret.yaml
      platform/sonarqube/infisical-secret.yaml
      platform/observability/infisical-secret.yaml
      platform/gitlab-runner/infisical-secret.yaml
