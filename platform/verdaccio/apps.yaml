apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: verdaccio
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://charts.verdaccio.org
    chart: verdaccio
    targetRevision: 4.29.0
    helm:
      releaseName: verdaccio
      values: |
        # LAN / CI: http://npm.lab — open for install (no Cloudflare Access).
        # Public: https://npm.nasraldin.com — gated by Cloudflare Access OTP
        # (cloudflare-tunnel bootstrap). Keeps project npm usage simple on LAN
        # while blocking anonymous internet traffic / scrape load.
        service:
          type: LoadBalancer
          loadBalancerIP: 192.168.68.106
          port: 80
        persistence:
          enabled: true
          storageClass: longhorn
        resources:
          requests:
            cpu: 50m
            memory: 128Mi
          limits:
            memory: 256Mi
        # Publish requires auth; anonymous can still install + proxy npmjs on LAN.
        configMap: |
          storage: file
          auth:
            htpasswd:
              file: ./htpasswd
              max_users: 100
          uplinks:
            npmjs:
              url: https://registry.npmjs.org/
          packages:
            "@*/*":
              access: $all
              publish: $authenticated
              proxy: npmjs
            "**":
              access: $all
              publish: $authenticated
              proxy: npmjs
          middlewares:
            audit:
              enabled: true
          logs: { type: stdout, format: pretty, level: http }
  destination:
    server: https://kubernetes.default.svc
    namespace: verdaccio
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
