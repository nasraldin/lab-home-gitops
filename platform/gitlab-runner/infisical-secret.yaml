# Synced by platform-gitlab-runner. Maps Infisical → Helm chart secret keys.
# Seed: ansible-playbook playbooks/infisical-seed.yml -e @secrets.yml
# (pipelines project /gitlab → GITLAB_RUNNER_TOKEN)
apiVersion: secrets.infisical.com/v1alpha1
kind: InfisicalSecret
metadata:
  name: gitlab-runner-token
  namespace: gitops
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  hostAPI: http://192.168.68.25:8090/api
  resyncInterval: 60
  authentication:
    universalAuth:
      secretsScope:
        projectSlug: pipelines
        envSlug: prod
        secretsPath: /gitlab
        recursive: false
      credentialsRef:
        secretName: infisical-universal-auth
        secretNamespace: security
  managedKubeSecretReferences:
    - secretName: gitlab-runner-token
      secretNamespace: gitops
      creationPolicy: Owner
      template:
        includeAllSecrets: false
        data:
          runner-token: "{{ .GITLAB_RUNNER_TOKEN.Value }}"
          runner-registration-token: ""
