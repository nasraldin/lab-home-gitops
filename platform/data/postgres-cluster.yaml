# Shared Postgres for Keycloak + SonarQube (CNPG).
# Secrets postgres-superuser / role passwords are created by
# lab-home-k8s/scripts/apply-bootstrap-secrets.sh (never commit passwords).
---
apiVersion: v1
kind: Namespace
metadata:
  name: data
  labels:
    app.kubernetes.io/part-of: lab-home
  annotations:
    argocd.argoproj.io/sync-wave: "0"
---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: postgres
  namespace: data
  annotations:
    argocd.argoproj.io/sync-wave: "10"
spec:
  instances: 1
  imageName: ghcr.io/cloudnative-pg/postgresql:16.6
  enableSuperuserAccess: true
  superuserSecret:
    name: postgres-superuser
  storage:
    size: 30Gi
    storageClass: longhorn
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      memory: 2Gi
  bootstrap:
    initdb:
      database: postgres
      owner: postgres
      secret:
        name: postgres-superuser
  managed:
    roles:
      - name: keycloak
        ensure: present
        login: true
        passwordSecret:
          name: cnpg-role-keycloak
      - name: sonar
        ensure: present
        login: true
        passwordSecret:
          name: cnpg-role-sonar
---
# One-shot Job: create application databases after roles exist.
# Re-run safely (IF NOT EXISTS). Image uses the CNPG client tools.
apiVersion: batch/v1
kind: Job
metadata:
  name: postgres-init-databases
  namespace: data
  annotations:
    argocd.argoproj.io/sync-wave: "20"
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  ttlSecondsAfterFinished: 600
  backoffLimit: 10
  template:
    metadata:
      labels:
        app: postgres-init-databases
    spec:
      restartPolicy: OnFailure
      containers:
        - name: init
          image: ghcr.io/cloudnative-pg/postgresql:16.6
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
          env:
            - name: PGHOST
              value: postgres-rw.data.svc.cluster.local
            - name: PGUSER
              value: postgres
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-superuser
                  key: password
          command:
            - /bin/bash
            - -c
            - |
              set -euo pipefail
              for i in $(seq 1 60); do
                if pg_isready -h "$PGHOST" -U "$PGUSER"; then
                  break
                fi
                echo "waiting for postgres ($i/60)"
                sleep 5
              done
              create_db() {
                local db="$1" owner="$2"
                exists=$(psql -tAc "SELECT 1 FROM pg_database WHERE datname='${db}'" || true)
                if [[ "$exists" != "1" ]]; then
                  psql -v ON_ERROR_STOP=1 -c "CREATE DATABASE ${db} OWNER ${owner}"
                  echo "created database ${db}"
                else
                  echo "database ${db} already exists"
                fi
              }
              create_db keycloak keycloak
              create_db sonar sonar
              echo "databases ready"
