apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: rabbitmq-cluster-operator
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "40"
spec:
  project: default
  source:
    repoURL: https://charts.bitnami.com/bitnami
    chart: rabbitmq-cluster-operator
    targetRevision: 4.4.34
    helm:
      releaseName: rabbitmq-operator
      values: |
        # Bitnami moved versioned tags to docker.io/bitnamilegacy (Aug 2025).
        # Override all operator + operand images until we migrate off Bitnami charts.
        global:
          security:
            allowInsecureImages: true
        rabbitmqImage:
          registry: docker.io
          repository: bitnamilegacy/rabbitmq
          tag: 4.1.3-debian-12-r1
        credentialUpdaterImage:
          registry: docker.io
          repository: bitnamilegacy/rmq-default-credential-updater
          tag: 1.0.8-debian-12-r0
        clusterOperator:
          image:
            registry: docker.io
            repository: bitnamilegacy/rabbitmq-cluster-operator
            tag: 2.16.1-debian-12-r0
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
        msgTopologyOperator:
          image:
            registry: docker.io
            repository: bitnamilegacy/rmq-messaging-topology-operator
            tag: 1.17.4-debian-12-r0
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
  destination:
    server: https://kubernetes.default.svc
    namespace: rabbitmq-operator
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: mariadb-operator
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "40"
spec:
  project: default
  source:
    repoURL: https://helm.mariadb.com/mariadb-operator
    chart: mariadb-operator
    targetRevision: 25.10.4
    helm:
      releaseName: mariadb-operator
      values: |
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
        webhook:
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
        certController:
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
  destination:
    server: https://kubernetes.default.svc
    namespace: mariadb-operator
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
