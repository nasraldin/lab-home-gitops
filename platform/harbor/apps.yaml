apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: harbor
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://helm.goharbor.io
    chart: harbor
    targetRevision: 1.18.0
    helm:
      releaseName: harbor
      values: |
        externalURL: https://harbor.nasraldin.com
        expose:
          type: loadBalancer
          tls:
            enabled: false
          loadBalancer:
            IP: 192.168.68.101
        # Initial admin password: set once from Infisical kubernetes/harbor
        # (HARBOR_ADMIN_PASSWORD) via `argocd app set` or helm --set after seed.
        # Do not commit the password. InfisicalSecret harbor-admin keeps SoT.
        persistence:
          persistentVolumeClaim:
            registry:
              storageClass: longhorn
        trivy:
          enabled: true
          ignoreUnfixed: true
          insecure: false
        nginx:
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
        portal:
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
        core:
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
        jobservice:
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
        registry:
          registry:
            resources:
              requests:
                cpu: 100m
                memory: 256Mi
          controller:
            resources:
              requests:
                cpu: 50m
                memory: 128Mi
        database:
          internal:
            resources:
              requests:
                cpu: 100m
                memory: 256Mi
        redis:
          internal:
            resources:
              requests:
                cpu: 50m
                memory: 128Mi
        notary:
          enabled: false
  destination:
    server: https://kubernetes.default.svc
    namespace: harbor
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
