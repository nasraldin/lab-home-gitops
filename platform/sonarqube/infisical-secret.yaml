apiVersion: secrets.infisical.com/v1alpha1
kind: InfisicalSecret
metadata:
  name: sonarqube-db
  namespace: apps
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  hostAPI: http://192.168.68.25:8090/api
  syncConfig:
    resyncInterval: 60s
  authentication:
    universalAuth:
      secretsScope:
        projectSlug: kubernetes
        envSlug: prod
        secretsPath: /sonarqube
        recursive: false
      credentialsRef:
        secretName: infisical-universal-auth
        secretNamespace: security
  managedKubeSecretReferences:
    - secretName: sonarqube-db
      secretNamespace: apps
      creationPolicy: Owner
      template:
        includeAllSecrets: false
        data:
          password: "{{ .SONARQUBE_DB_PASSWORD.Value }}"
          jdbc-password: "{{ .SONARQUBE_DB_PASSWORD.Value }}"
