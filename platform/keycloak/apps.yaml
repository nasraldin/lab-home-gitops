apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: keycloak
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://charts.bitnami.com/bitnami
    chart: keycloak
    targetRevision: 25.2.0
    helm:
      releaseName: keycloak
      values: |
        production: true
        proxy: edge
        httpRelativePath: /
        hostname: id.nasraldin.com
        hostnameStrict: true
        service:
          type: LoadBalancer
          loadBalancerIP: 192.168.68.103
        ingress:
          enabled: false
        # Admin + DB passwords from Infisical (platform/secrets InfisicalSecret CRs).
        # Bootstrap: seed Infisical, create machine-identity Secret, wait for sync.
        auth:
          adminUser: admin
          existingSecret: keycloak-admin
          passwordSecretKey: admin-password
        postgresql:
          enabled: false
        externalDatabase:
          host: postgres-rw.data.svc.cluster.local
          port: 5432
          user: keycloak
          database: keycloak
          existingSecret: keycloak-db
          existingSecretPasswordKey: password
  destination:
    server: https://kubernetes.default.svc
    namespace: keycloak
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
