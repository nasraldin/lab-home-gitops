apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: keycloak
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://charts.bitnami.com/bitnami
    chart: keycloak
    targetRevision: 25.2.0
    helm:
      releaseName: keycloak
      values: |
        # Bitnami moved versioned tags to docker.io/bitnamilegacy (Aug 2025).
        global:
          security:
            allowInsecureImages: true
        image:
          registry: docker.io
          repository: bitnamilegacy/keycloak
          tag: 26.3.3-debian-12-r0
        production: true
        # Required with production=true when TLS terminates at Cloudflare / edge proxy.
        proxyHeaders: xforwarded
        httpRelativePath: /
        hostname: id.nasraldin.com
        hostnameStrict: false
        hostnameBackchannelDynamic: true
        service:
          type: LoadBalancer
          loadBalancerIP: 192.168.68.103
        ingress:
          enabled: false
        # Admin + DB passwords from Infisical (platform/secrets InfisicalSecret CRs).
        auth:
          adminUser: admin
          existingSecret: keycloak-admin
          passwordSecretKey: admin-password
        postgresql:
          enabled: false
        externalDatabase:
          host: postgres-rw.database.svc.cluster.local
          port: 5432
          user: keycloak
          database: keycloak
          existingSecret: keycloak-db
          existingSecretPasswordKey: password
        resources:
          requests:
            cpu: 100m
            memory: 512Mi
          limits:
            memory: 1Gi
  destination:
    server: https://kubernetes.default.svc
    namespace: apps
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
