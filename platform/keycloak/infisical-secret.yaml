# Synced into namespace keycloak by platform-keycloak Application.
# Requires Secret infisical-universal-auth in security.
apiVersion: secrets.infisical.com/v1alpha1
kind: InfisicalSecret
metadata:
  name: keycloak-admin
  namespace: apps
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  hostAPI: http://192.168.68.25:8090/api
  syncConfig:
    resyncInterval: 60s
  authentication:
    universalAuth:
      secretsScope:
        projectSlug: kubernetes
        envSlug: prod
        secretsPath: /keycloak
        recursive: false
      credentialsRef:
        secretName: infisical-universal-auth
        secretNamespace: security
  managedKubeSecretReferences:
    - secretName: keycloak-admin
      secretNamespace: apps
      creationPolicy: Owner
      template:
        includeAllSecrets: false
        data:
          admin-password: "{{ .KEYCLOAK_ADMIN_PASSWORD.Value }}"
---
apiVersion: secrets.infisical.com/v1alpha1
kind: InfisicalSecret
metadata:
  name: keycloak-db
  namespace: apps
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  hostAPI: http://192.168.68.25:8090/api
  syncConfig:
    resyncInterval: 60s
  authentication:
    universalAuth:
      secretsScope:
        projectSlug: kubernetes
        envSlug: prod
        secretsPath: /keycloak
        recursive: false
      credentialsRef:
        secretName: infisical-universal-auth
        secretNamespace: security
  managedKubeSecretReferences:
    - secretName: keycloak-db
      secretNamespace: apps
      creationPolicy: Owner
      template:
        includeAllSecrets: false
        data:
          password: "{{ .KEYCLOAK_DB_PASSWORD.Value }}"
