apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform-longhorn
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "30"
spec:
  project: default
  source:
    repoURL: https://charts.longhorn.io
    chart: longhorn
    targetRevision: 1.9.1
    helm:
      releaseName: longhorn
      values: |
        defaultSettings:
